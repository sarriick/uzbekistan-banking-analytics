[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uzbekistan-banking-analytics"
version = "1.0.0"
description = "Reproducible analysis of Uzbekistan's banking sector using Central Bank open data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "duckdb>=1.4,<3", "streamlit>=1.45,<2",
  "plotly>=6,<8", "lxml>=5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
