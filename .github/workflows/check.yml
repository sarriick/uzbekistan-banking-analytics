name: Validate banking analytics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[dev]'
      - run: python -m uzbank.build
      - run: python -m uzbank.report
      - run: python -m pytest -q
      - name: Check committed data and conclusions match the archived sources
        run: git diff --exit-code -- data/processed reports/findings.ru.md
